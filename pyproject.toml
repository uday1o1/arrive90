[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arrive90"
version = "0.0.1"
description = "Calibrated and risk-aware MBTA subway journey planning"
readme = "README.md"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
authors = [{ name = "Uday Arora" }]
dependencies = [
  "gtfs-realtime-bindings==2.1.0",
  "pyarrow>=21.0.0,<22",
  "pyyaml>=6.0.2,<7",
  "xgboost==3.3.0",
]

[project.scripts]
arrive90-source-audit = "arrive90_data_contracts.source_audit:main"
arrive90-ingest-schedule = "arrive90_ingestion.schedule:main"
arrive90-generate-query-population = "arrive90_routing.population:main"

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.10,<1",
  "types-pyyaml>=6.0.12.20250516,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/data_contracts/src/arrive90_data_contracts",
  "packages/ingestion/src/arrive90_ingestion",
  "packages/routing/src/arrive90_routing",
  "packages/features/src/arrive90_features",
  "packages/outcomes/src/arrive90_outcomes",
  "packages/models/src/arrive90_models",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=arrive90_data_contracts --cov=arrive90_ingestion --cov=arrive90_routing --cov=arrive90_features --cov=arrive90_outcomes --cov=arrive90_models --cov-report=term-missing --cov-fail-under=90"
testpaths = ["packages/data_contracts/tests", "packages/ingestion/tests", "packages/routing/tests", "packages/features/tests", "packages/outcomes/tests", "packages/models/tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "packages/data_contracts/src",
  "packages/data_contracts/tests",
  "packages/ingestion/src",
  "packages/ingestion/tests",
  "packages/features/src",
  "packages/features/tests",
  "packages/outcomes/src",
  "packages/outcomes/tests",
  "packages/models/src",
  "packages/models/tests",
  "packages/routing/src",
  "packages/routing/tests",
  "scripts",
  "tools",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"packages/data_contracts/tests/**" = ["S101"]
"packages/ingestion/tests/**" = ["S101"]
"packages/features/tests/**" = ["S101"]
"packages/outcomes/tests/**" = ["S101"]
"packages/models/tests/**" = ["S101"]
"packages/routing/tests/**" = ["S101"]
