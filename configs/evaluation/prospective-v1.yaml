protocol_id: prospective-shadow-v1
acceptance_version: v1
status: NOT_FROZEN_SOURCE_GATE_BLOCKED
timezone: America/New_York
shakeout:
  service_day_blocks_min: 28
  every_scheduled_query_required: true
  open_operational_defects_required: 0
panel:
  service_day_blocks_min: 56
  serving_decisions_min: 2000
  serving_base_queries_min: 1000
  fixed_end_date_required: true
  post_hoc_extension_forbidden: true
  outcome_horizon_minutes: 210
precision:
  sampling_unit: COMPLETE_SERVICE_DAY
  variance_rule: MAX_HISTORICAL_OR_SHAKEOUT
  confidence_level: 0.95
  half_width_max: 0.03
  bootstrap_replicates_min: 2000
  prestudy_attrition_fraction: 0.05
serving_policy:
  identifier: SERVING_HISTORICAL_V1
  model_schema: historical_v1
  candidate_generator_mode: STATIC_ROUTE_POLICY_V1
  sends_experimental_recommendations_to_riders: false
shadow_policy:
  identifier: SHADOW_095_EVIDENCE_V1
  reliability_target: "0.95"
  maximum_extra_minutes: 20
  band: "[0.95,1.00]"
  decisions_min: 800
  base_queries_min: 400
  service_day_blocks_min: 56
  calibration_upper_95_max: 0.03
  serving_eligible: false
  user_visible: false
  current_acceptance_contribution: NONE
lineage:
  required_inputs:
    - feed_blob_hashes
    - fetch_attempt_hashes
    - candidate_manifest_hash
    - feature_row_hash
    - model_bundle_hash
    - decision_context_hash
    - decision_hash
failure_denominator:
  include_collector_failure: true
  include_router_failure: true
  include_model_failure: true
  include_abstention: true
training:
  prospective_v2_from_final_panel_forbidden: true
