version: DECISION_POLICY_V1
status: MECHANICS_FROZEN_SOURCE_GATE_FAILED
probability:
  canonical_precision_decimal_places: 6
  rounding: ROUND_HALF_EVEN
  diagnostics_use_unrounded_value: true
candidate_universe:
  generator: STATIC_ROUTE_POLICY_V1
  maximum_transfers: 1
  maximum_candidates: 16
  alert_mask: ALERT_MASK_V1
initial:
  planned_time: scheduled_arrival_utc - effective_ready_at_utc
  extra_time: candidate_planned_time - comparator_planned_time
  default_maximum_extra_minutes: 20
  ready_lead_supported_minutes: [0, 15]
  deadline_grid_minutes: [5, 180, 5]
  comparator_tuple:
    - scheduled_arrival_utc
    - planned_time
    - scheduled_departure_utc
    - transfer_count
    - ordered_route_patterns
    - ordered_platform_stops
    - bytewise_policy_key
  target_met_tuple:
    - scheduled_arrival_utc
    - negative_rounded_probability
    - planned_time
    - transfer_count
    - ordered_route_patterns
    - ordered_platform_stops
    - bytewise_policy_key
  fallback_tuple:
    - negative_rounded_probability
    - scheduled_arrival_utc
    - planned_time
    - transfer_count
    - ordered_route_patterns
    - ordered_platform_stops
    - bytewise_policy_key
  support_lookup: FAIL_CLOSED_EXACT_CONJUNCTION
  quantile_support_independent: true
  nonselected_model_output: NOT_SELECTED_OUTPUT_UNVALIDATED
  statuses:
    - TARGET_MET
    - TARGET_NOT_MET
    - DEGRADED_SCHEDULE_ONLY
    - STALE_LIVE_DATA
    - MODEL_ABSTAINED
    - INSUFFICIENT_EVIDENCE
    - NO_SUPPORTED_ITINERARY
recovery:
  actionable_state: AT_TRANSFER
  reason_precedence:
    - CAUSAL_CLOSURE
    - LOW_TRANSFER_PROBABILITY
  low_transfer_probability_threshold: 0.500000
  maximum_extra_minutes: 20
  ranking: SAME_AS_STATIC_COMPARATOR
  model_outputs: ALWAYS_NULL
  statuses:
    - RECOVERY_ACTION_AVAILABLE
    - NO_DISTINCT_RECOVERY_ACTION
trip_state_edges:
  direct:
    - NOT_STARTED -> ON_FINAL_LEG
  one_transfer:
    - NOT_STARTED -> ON_FIRST_LEG
    - ON_FIRST_LEG -> AT_TRANSFER
    - AT_TRANSFER -> ON_FINAL_LEG
  recovery_zero_transfer:
    - AT_TRANSFER -> ON_FINAL_LEG
  recovery_one_transfer:
    - AT_TRANSFER -> ON_FIRST_LEG
    - ON_FIRST_LEG -> AT_TRANSFER
    - AT_TRANSFER -> ON_FINAL_LEG
  stop: ANY_NONTERMINAL -> ENDED
eligibility_manifest_hash: null
fixed_point_discovery_artifact_hash: null
acceptance_note: Empirical hashes remain null until the failed Milestone 0 source gate can resume.
