policy_version: release-boundary-v1
release_authority: artifacts/reports/gates/milestone-9.json
publication_requires_explicit_user_authorization: true
non_loopback:
  permitted_gate_status: PASSED
  tls_required: true
  exact_host_allow_list_required: true
  exact_https_origin_allow_list_required: true
  wildcard_cors_forbidden: true
  trusted_proxy_ip_allow_list_required: true
  plaintext_backend_publication_forbidden: true
runtime:
  container_runs_as_uid: 65532
  mutable_state_path: /state/arrive90.sqlite3
  read_only_application_source: true
  access_log_enabled: false
  trip_state_ttl_seconds_max: 21600
  decision_capability_ttl_seconds_max: 600
security_scanner:
  name: Trivy
  version: 0.73.0
  image: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
  fail_severities: [CRITICAL, HIGH]
  fail_on_secret: true
  ignored_unfixed_vulnerabilities: false
