name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.23"
          enable-cache: false
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run local CI-equivalent checks
        run: make check
